 -p scripts/enchants/xinshidi.lua && echo \"OK: 语法通过\" && git diff scripts/enchants/xinshidi.lua)", "Bash(cd /tmp && cat > test_xsd.lua <<'EOF'\n-- 模拟 HH hh_equip.lua:915-924 生成的词条 desc,再套用 Part 4 的替换逻辑\nlocal function hh_format_desc(value)\n    local desc = \"「欧皇模拟器」商店购物折扣！\\n装备后商店物品%s折\\n（装备后需重新打开商店生效，如果失效脱掉在带上）\"\n    local buff_desc = string.format(desc, value)\n    if value == 9 then buff_desc = buff_desc .. \"(已满)\" end\n    return \"新史低:\" .. buff_desc\nend\n\nlocal function moon_replace(entry_desc, value)\n    return (entry_desc or \"\"):gsub(\"商店物品%d+折\", \"商店物品\" .. tostring(14 - value) .. \"折\")\nend\n\nlocal cases = {\n    { 5, \"商店物品9折\" },\n    { 6, \"商店物品8折\" },\n    { 7, \"商店物品7折\" },\n    { 8, \"商店物品6折\" },\n    { 9, \"商店物品5折(已满)\" },\n}\nlocal pass = true\nfor _, c in ipairs(cases) do\n    local got = moon_replace(hh_format_desc(c[1]), c[1])\n    local ok = got:find(c[2], 1, true) ~= nil\n    -- 同时确认不含未换算的 \"商店物品X折\"(X==value)\n    local stale = got:find(\"商店物品\" .. c[1] .. \"折\", 1, true) ~= nil\n    if ok and not stale then\n        print((\"PASS: value=%d -> %q\"):format(c[1], got))\n    else\n        pass = false\n        print((\"FAIL: value=%d -> %q (ok=%s stale=%s)\"):format(c[1], got, tostring(ok), tostring(stale)))\n    end\nend\n\n-- 非 XSD 词条:不应被替换(模拟普通词条 desc 不含\"商店物品X折\"或含其他数字)\nlocal other = \"七步之外:受到100+伤害时有1%概率获得\\n增加攻击距离9\"\nlocal after = moon_replace(other, 9)\nif after == other then print(\"PASS: 非XSD词条原样返回\") else pass=false; print(\"FAIL: 非XSD词条被误改 -> \" .. after) end\n\nprint(pass and \"ALL PASS\" or \"HAS FAILURES\")\nEOF\nlua test_xsd.lua && rm test_xsd.lua)", "Bash(cd /tmp && cat > test_xsd2.lua <<'EOF'\nlocal function hh_format_desc(value)\n    local desc = \"「欧皇模拟器」商店购物折扣！\\n装备后商店物品%s折\\n（装备后需重新打开商店生效，如果失效脱掉在带上）\"\n    local buff_desc = string.format(desc, value)\n    if value == 9 then buff_desc = buff_desc .. \"(已满)\" end\n    return \"新史低:\" .. buff_desc\nend\nlocal function moon_replace(entry_desc, value)\n    return (entry_desc or \"\"):gsub(\"商店物品%d+折\", \"商店物品\" .. tostring(14 - value) .. \"折\")\nend\n\nlocal cases = {\n    { 5, \"商店物品9折\", false },\n    { 6, \"商店物品8折\", false },\n    { 7, \"商店物品7折\", false },\n    { 8, \"商店物品6折\", false },\n    { 9, \"商店物品5折\", true },   -- 已满\n}\nlocal pass = true\nfor _, c in ipairs(cases) do\n    local got = moon_replace(hh_format_desc(c[1]), c[1])\n    local ok = got:find(c[2], 1, true) ~= nil\n    local full_mark = c[3] and got:find(\"(已满)\", 1, true) ~= nil or true\n    local non_full_mark = (not c[3]) and got:find(\"(已满)\", 1, true) == nil or true\n    if ok and full_mark and non_full_mark then\n        print((\"PASS: value=%d\"):format(c[1]))\n    else\n        pass = false\n        print((\"FAIL: value=%d -> %q\"):format(c[1], got))\n    end\nend\nprint(pass and \"ALL PASS\" or \"HAS FAILURES\")\nEOF\nlua test_xsd2.lua && rm test_xsd2.lua)"]
