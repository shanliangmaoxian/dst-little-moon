     if not prefab then\n                prefab = entry:match(\"^%s*(.-)%s*$\")\n                count, role = 1, \"all\"\n            end\n            if prefab and prefab ~= \"\" then\n                local n = tonumber(count) or 1\n                if n < 1 then n = 1 end\n                if role == nil or role == \"\" then role = \"all\" end\n                table.insert(items, { prefab = prefab, count = n, role = role })\n            end\n        end\n        if #items > 0 then\n            table.insert(plans, items)\n        end\n    end\n    return plans\nend\nlocal function RoleMatches(role, player_prefab)\n    if not role or role == \"\" or role == \"all\" then return true end\n    return string.lower(role) == string.lower(player_prefab or \"\")\nend\n\nlocal function dump(p)\n    local out = {}\n    for i, plan in ipairs(p) do\n        local items = {}\n        for _, it in ipairs(plan) do\n            table.insert(items, string.format(\"%s=%s:%s\", it.prefab, it.count, it.role))\n        end\n        table.insert(out, \"方案\" .. i .. \"[\" .. table.concat(items, \",\") .. \"]\")\n    end\n    return table.concat(out, \" | \")\nend\n\nlocal checks = {\n    { \"cutstone,10,all|goldnugget,5,wilson:::spear,1,all\",\n      \"方案1[cutstone=10:all,goldnugget=5:wilson] | 方案2[spear=1:all]\" },\n    { \"\", \"\" },\n    { \"cutstone\", \"方案1[cutstone=1:all]\" },\n    { \"cutstone,5\", \"方案1[cutstone=5:all]\" },\n    { \"a,0,wilson\", \"方案1[a=1:wilson]\" },\n    { \"  spear  ,  2  ,  WILSON  \", \"方案1[spear=2:WILSON]\" },\n    { \"a,1,all:::b,2,all:::c,3,all\", \"方案1[a=1:all] | 方案2[b=2:all] | 方案3[c=3:all]\" },\n    { \"x,1,all|y,2,all:::\", \"方案1[x=1:all,y=2:all]\" },\n    { nil, \"\" },\n    { 123, \"\" },\n}\nlocal pass = true\nfor _, c in ipairs(checks) do\n    local got = dump(ParseConfig(c[1]))\n    local ok = got == c[2]\n    if not ok then pass = false end\n    print((ok and \"PASS\" or \"FAIL\") .. \": \" .. tostring(c[1]) .. \" => \" .. got)\nend\n\n-- RoleMatches\nlocal role_checks = {\n    { \"all\", \"wilson\", true },\n    { \"WILSON\", \"wilson\", true },\n    { \"wilson\", \"Wendy\", false },\n    { nil, \"wendy\", true },\n}\nfor _, rc in ipairs(role_checks) do\n    local ok = RoleMatches(rc[1], rc[2]) == rc[3]\n    if not ok then pass = false end\n    print((ok and \"PASS\" or \"FAIL\") .. \": role(\" .. tostring(rc[1]) .. \") vs \" .. rc[2] .. \" => \" .. tostring(rc[3]))\nend\n\nprint(pass and \"ALL PASS\" or \"HAS FAILURES\")\nEOF\nlua test_parse.lua && rm test_parse.lua)", "Bash(cd /Users/maoxian/Vault/Code/dst/dst-little-moon && luac -p scripts/core/config.lua && echo \"OK config.lua\" && sed -n '51,60p' scripts/core/config.lua)", "Bash(cd /Users/maoxian/Vault/Code/dst/dst-little-moon && luac -p scripts/features/start_gift_client.lua && echo \"OK 语法\" && echo \"=== 残留 _G._moon 检查（应只剩注释）===\" && grep -n \"_G\\._moon\" scripts/features/start_gift_client.lua && echo \"=== rawget/rawset 落点 ===\" && grep -n \"rawget\\|rawset\" scripts/features/start_gift_client.lua)", "Bash(cd /Users/maoxian/Vault/Code/dst/dst-little-moon && cat >> docs/MODDING_PITFALLS.md <<'EOF'\n\n## 20. strict.lua 严格模式：`_G.xxx = v` 读写全局变量会报错\n\n客户端/服务端开启 strict.lua（DST 自带严格模式）时，**给全局表 `_G` 赋字段会触发 `__newindex`**，报错：\n\n```\nassign to undeclared variable '_moon_start_gift_data'\nLUA ERROR: scripts/strict.lua:14\n```\n\n读取未声明的全局变量同理报 `global variable ... is not declared`。\n\n**根因：** `_G` 就是全局表本身，带 strict metatable；`_G.foo = x` 等价于声明全局变量，未先声明即报错。\n\n**正确做法：** 用 `rawset`/`rawget` 绕开 metatable 读写临时全局：\n\n```lua\nrawset(_G, \"_moon_xxx\", data)          -- 写\nlocal data = rawget(_G, \"_moon_xxx\")   -- 读（未写入时返回 nil，不报错）\n```\n\n**注意：** 读取也**必须**用 rawget——若在写入前读取（如 RPC 响应未到就点按钮），`_G.foo` 会触发 `__index` 报错。\n\n**先例：** 开局礼包 `_moon_start_gift_data`/`_moon_gift_ui`（2026-08 修复）；CHANGELOG 1.15.9 的 `_Moon_ShopBuyer` 同款。\nEOF\necho \"已追加\" && grep -n \"## 20\" docs/MODDING_PITFALLS.md)", "Bash(cd /Users/maoxian/Vault/Code/dst/dst-little-moon && for f in scrip